name: release

on:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  latest-major-version-tagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-r-us/actions-tagger@330ddfac760021349fef7ff62b372f2f691c20fb # latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
