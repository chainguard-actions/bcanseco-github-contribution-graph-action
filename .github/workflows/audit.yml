name: audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
  - cron: '0 12 * * *' # every day at noon

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - run: npm audit --production
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
    - uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089 # master
    - uses: github/codeql-action/init@d97b3428e8eebbb1810cf454d6397886d136b4ba # main
    - uses: github/codeql-action/analyze@d97b3428e8eebbb1810cf454d6397886d136b4ba # main
