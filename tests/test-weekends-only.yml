name: Test weekends-only configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test the INCLUDE_WEEKDAYS=false INCLUDE_WEEKENDS=true configuration.
      # ORIGIN_TIMESTAMP=1704067200 is 2024-01-01 00:00:00 UTC (a Monday).
      # With MAX_DAYS=7 and INCLUDE_WEEKDAYS=false, only weekend days (Sat/Sun)
      # within the 7-day window will get commits.
      # We use FORCE_PUSH=true to skip the clone step.
      - id: action
        uses: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_EMAIL: test@example.com
          GIT_BRANCH: act-harness
          FORCE_PUSH: "true"
          MAX_DAYS: "7"
          MIN_COMMITS_PER_DAY: "1"
          MAX_COMMITS_PER_DAY: "1"
          INCLUDE_WEEKDAYS: "false"
          INCLUDE_WEEKENDS: "true"
          ORIGIN_TIMESTAMP: "1704067200"
        continue-on-error: true

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action either succeeds or fails at the push step.
          # Either way it should have started and processed the day filtering.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with weekends-only config (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
