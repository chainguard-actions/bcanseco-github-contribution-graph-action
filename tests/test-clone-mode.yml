name: Test clone mode (default, no force push)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GIT_EMAIL: test@example.com
          GIT_HOST: github.com
          GIT_BRANCH: act-harness
          FORCE_PUSH: "false"
          MAX_DAYS: "1"
          MIN_COMMITS_PER_DAY: "1"
          MAX_COMMITS_PER_DAY: "1"

      - name: Assert action ran (failed gracefully on sentinel repo clone)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In clone mode, the action tries to clone GITHUB_REPOSITORY.
          # The sentinel repo does not exist on GitHub, so the clone fails.
          # We accept success, failure, or cancelled.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
