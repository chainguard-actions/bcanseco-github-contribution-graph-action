name: Test force push mode configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with FORCE_PUSH=true (skips clone, uses git init)
        id: action
        uses: .
        env:
          GITHUB_ACTOR: testuser
          GITHUB_REPOSITORY: testuser/nonexistent-repo-for-testing
          GITHUB_TOKEN: fake-token-for-testing
          GIT_EMAIL: test@example.com
          GIT_BRANCH: main
          MAX_DAYS: "1"
          MIN_COMMITS_PER_DAY: "1"
          MAX_COMMITS_PER_DAY: "1"
          FORCE_PUSH: "true"
        continue-on-error: true

      - name: Assert action failed at push step (not at clone/config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With FORCE_PUSH=true, the action uses git init instead of clone.
          # It should fail at the push step due to invalid credentials,
          # not at configuration parsing or the clone step.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at push step as expected (invalid credentials)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but not a config error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
