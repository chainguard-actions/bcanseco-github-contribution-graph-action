name: Test custom settings (multi-day, weekdays only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GIT_EMAIL: test@example.com
          GIT_HOST: github.com
          GIT_BRANCH: act-harness
          FORCE_PUSH: "true"
          MAX_DAYS: "7"
          MIN_COMMITS_PER_DAY: "1"
          MAX_COMMITS_PER_DAY: "3"
          INCLUDE_WEEKDAYS: "true"
          INCLUDE_WEEKENDS: "false"
          GIT_COMMIT_MESSAGE: "chore: test commit"

      - name: Assert action ran (committed or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action tries to push to github.com with the sentinel repo,
          # which does not exist. We accept success, failure, or cancelled.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "PASS: action ran with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
